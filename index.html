<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON MARBLE BATTLE</title>
<style>
  :root { --bg: #02030a; --panel: rgba(8, 12, 26, 0.85); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: #e8f0ff;
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    background: radial-gradient(circle at 50% 40%, #080c22 0%, #02030a 72%);
    touch-action: none;
  }
  #hud {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    pointer-events: none; max-width: 96vw;
  }
  .fighter-card {
    background: var(--panel);
    border: 1px solid rgba(120, 200, 255, 0.25);
    border-radius: 8px; padding: 4px 8px; min-width: 84px;
    backdrop-filter: blur(4px);
    transition: opacity 0.4s, filter 0.4s;
  }
  .fighter-card.dead { opacity: 0.28; filter: grayscale(1); }
  .fighter-card .name {
    font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
    margin-bottom: 4px; text-transform: uppercase;
    display: flex; align-items: center; gap: 5px;
  }
  .fighter-card .tag { font-size: 8px; opacity: 0.6; font-weight: 600; letter-spacing: 0.3px; }
  .fighter-card .count { font-size: 10px; font-weight: 800; opacity: 0.95; }
  .hpbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .hpfill { height: 100%; width: 100%; border-radius: 3px; transition: width 0.2s ease; }
  /* Keep the HUD tiny on phones so it never buries the arena */
  @media (max-width: 620px) {
    #hud { gap: 5px; top: 6px; }
    .fighter-card { min-width: 0; padding: 3px 6px; border-radius: 6px; }
    .fighter-card .name { font-size: 9px; margin-bottom: 3px; gap: 3px; }
    .fighter-card .tag { display: none; }
    .hpbar { height: 4px; }
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    background: radial-gradient(circle at 50% 50%, rgba(2,3,10,0.55), rgba(2,3,10,0.93));
    z-index: 10; transition: opacity 0.5s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #title {
    font-size: clamp(32px, 8vw, 84px); font-weight: 900; letter-spacing: 4px; line-height: 1;
    background: linear-gradient(90deg, #39ff14, #00e5ff, #ff2fd0, #ffd23f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 20px rgba(57,255,20,0.55)); margin-bottom: 6px;
  }
  #subtitle {
    color: #9fb4d8; letter-spacing: 3px; font-size: clamp(11px, 2.5vw, 15px);
    margin-bottom: 26px; text-transform: uppercase;
  }
  .btn {
    pointer-events: auto; cursor: pointer; border: none;
    padding: 15px 40px; font-size: 18px; font-weight: 800; letter-spacing: 2px;
    border-radius: 40px; color: #02030a;
    background: linear-gradient(90deg, #39ff14, #00e5ff);
    box-shadow: 0 0 28px rgba(57,255,20,0.6);
    text-transform: uppercase; transition: transform 0.12s, box-shadow 0.2s;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 44px rgba(57,255,20,0.9); }
  .btn:active { transform: scale(0.98); }
  #winner { font-size: clamp(26px, 6vw, 58px); font-weight: 900; letter-spacing: 3px; margin-bottom: 8px; }
  .legend {
    margin-top: 26px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    color: #7c93bd; font-size: 12px; letter-spacing: 1px; max-width: 92vw;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  #hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #5a6c8c; font-size: 12px; letter-spacing: 1.5px;
    pointer-events: none; text-align: center; width: 90%;
  }
  #mute {
    position: absolute; top: 10px; right: 12px; z-index: 12;
    pointer-events: auto; cursor: pointer;
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1;
    background: rgba(8,12,26,0.7); border: 1px solid rgba(120,200,255,0.25);
    color: #cfe4ff; backdrop-filter: blur(4px);
    transition: transform 0.1s, box-shadow 0.2s;
  }
  #mute:hover { transform: scale(1.08); box-shadow: 0 0 16px rgba(0,229,255,0.4); }
  #spawn {
    position: absolute; top: 10px; left: 12px; z-index: 12;
    pointer-events: auto; cursor: pointer;
    height: 40px; padding: 0 16px; border-radius: 20px;
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    color: #02030a; background: linear-gradient(90deg, #ff2fd0, #ffd23f);
    border: none; box-shadow: 0 0 18px rgba(255,47,208,0.5);
    transition: transform 0.1s, box-shadow 0.2s, opacity 0.3s;
  }
  #spawn:hover { transform: scale(1.06); box-shadow: 0 0 28px rgba(255,47,208,0.8); }
  #spawn:active { transform: scale(0.96); }
  #spawn.off { opacity: 0.35; pointer-events: none; }
  #winner.celebrate { animation: pop 0.7s ease-out both, throb 1.1s ease-in-out 0.7s infinite; }
  @keyframes pop { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes throb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .confetti {
    position: absolute; top: -24px; width: 9px; height: 14px;
    border-radius: 2px; opacity: 0.95; will-change: transform;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(112vh) rotate(720deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #winner.celebrate { animation: none; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="spawn" class="off" title="Spawn two more fighters">➕ Spawn</button>
  <div id="mute" title="Mute / unmute">🔊</div>
  <div id="hud"></div>
  <div id="hint">FIGHTERS SUMMON CLONE ALLIES &nbsp;•&nbsp; CLICK / TAP TO DROP A SHOCKWAVE</div>
  <div id="overlay">
    <div id="winner"></div>
    <div id="title">NEON MARBLE BATTLE</div>
    <div id="subtitle">Summon clone allies • last squad rolling wins</div>
    <button class="btn" id="startBtn">FIGHT!</button>
    <div class="legend">
      <span>🤖 ROBOT — heavy tank</span>
      <span>🔫 GUNNER — fires neon rounds</span>
      <span>🦈 SHARK — lunges &amp; bites</span>
      <span>🕴️ STICK — fast all-rounder</span>
      <span>🛡️ TANK — heavy cannon shells</span>
      <span>🐙 OCTOPUS — tentacle lash</span>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("hud");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const winnerEl = document.getElementById("winner");
  const titleEl = document.getElementById("title");
  const subtitleEl = document.getElementById("subtitle");
  const muteBtn = document.getElementById("mute");
  const spawnBtn = document.getElementById("spawn");

  // ---- Audio (synthesized, no external files) -----------------------------
  let actx = null, master = null, muted = false, soundsThisFrame = 0;
  function initAudio() {
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    } catch (e) { actx = null; }
  }
  function tone({ freq = 440, freq2 = null, type = "square", dur = 0.08, vol = 0.3, noise = false }) {
    if (!actx || muted) return;
    const t0 = actx.currentTime;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    g.connect(master);
    let src;
    if (noise) {
      const n = Math.floor(actx.sampleRate * dur);
      const buf = actx.createBuffer(1, n, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      src = actx.createBufferSource(); src.buffer = buf;
    } else {
      src = actx.createOscillator(); src.type = type;
      src.frequency.setValueAtTime(freq, t0);
      if (freq2) src.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
    }
    src.connect(g); src.start(t0); src.stop(t0 + dur);
  }
  const budget = () => (soundsThisFrame < 4 ? (soundsThisFrame++, true) : false);
  const SFX = {
    shoot()  { if (budget()) tone({ freq: 880, freq2: 480, type: "square", dur: 0.05, vol: 0.10 }); },
    cannon() { tone({ freq: 150, freq2: 45, type: "sawtooth", dur: 0.24, vol: 0.32 }); tone({ noise: true, dur: 0.2, vol: 0.18 }); },
    hit()    { if (budget()) tone({ freq: rand(180, 360), type: "square", dur: 0.05, vol: 0.10 }); },
    bite()   { tone({ freq: 520, freq2: 110, type: "sawtooth", dur: 0.12, vol: 0.16 }); },
    lash()   { tone({ freq: 640, freq2: 140, type: "sine", dur: 0.16, vol: 0.15 }); },
    summon() { tone({ freq: 300, freq2: 950, type: "triangle", dur: 0.18, vol: 0.18 }); },
    death()  { tone({ noise: true, dur: 0.35, vol: 0.32 }); tone({ freq: 130, freq2: 40, type: "sine", dur: 0.3, vol: 0.22 }); },
    shock()  { tone({ freq: 200, freq2: 820, type: "sine", dur: 0.2, vol: 0.2 }); },
    win()    {
      if (!actx || muted) return;
      [523, 659, 784, 1047].forEach((f, i) =>
        setTimeout(() => tone({ freq: f, type: "triangle", dur: 0.22, vol: 0.28 }), i * 130));
    },
  };
  function setMuted(m) { muted = m; muteBtn.textContent = m ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", () => { initAudio(); setMuted(!muted); });

  // ---- Arena sizing -------------------------------------------------------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- Fighter roster — glow-in-the-dark neon -----------------------------
  const ROSTER = [
    { name: "Titan",  type: "robot",  color: "#39ff14", emoji: "🤖" }, // toxic green
    { name: "Rico",   type: "gunner", color: "#ff2fd0", emoji: "🔫" }, // hot magenta
    { name: "Jaws",   type: "shark",  color: "#00e5ff", emoji: "🦈" }, // cyan
    { name: "Zed",    type: "stick",  color: "#ffe600", emoji: "🕴️" }, // electric yellow
    { name: "Mag",    type: "robot",  color: "#ff6b00", emoji: "🤖" }, // neon orange
    { name: "Nyx",    type: "gunner", color: "#c04bff", emoji: "🔫" }, // uv purple
    { name: "Fin",    type: "shark",  color: "#14ffd1", emoji: "🦈" }, // aqua
    { name: "Bolt",   type: "stick",  color: "#ff1e6b", emoji: "🕴️" }, // laser pink
    { name: "Rex",    type: "robot",  color: "#d0ff00", emoji: "🤖" }, // chartreuse
    { name: "Sting",  type: "gunner", color: "#2f7bff", emoji: "🔫" }, // electric blue
    { name: "Reef",   type: "shark",  color: "#00ffa2", emoji: "🦈" }, // mint
    { name: "Ace",    type: "stick",  color: "#ffae00", emoji: "🕴️" }, // amber
    { name: "Krug",   type: "tank",   color: "#ff2b2b", emoji: "🛡️" }, // neon red
    { name: "Rumble", type: "tank",   color: "#caff00", emoji: "🛡️" }, // acid lime
    { name: "Inky",   type: "octopus", color: "#7c5cff", emoji: "🐙" }, // blue-violet
    { name: "Squish", type: "octopus", color: "#ff8ad4", emoji: "🐙" }, // bubblegum
  ];

  const MAX_HP = 100;
  const NUM_FIGHTERS = 6;      // how many original fighters start the brawl
  const TEAM_CAP = 2;          // max living members one fighter's squad can field
  const SUMMON_BUDGET = 2;     // total clones a squad may ever summon in a match
  const MAX_MARBLES = 12;      // global cap so summoning can't run away
  let teamSummons = {};        // clones summoned so far, per team (reset each match)
  const GRAVITY = 0.30;        // downward pull — puts them on the ground (gentler = slower)
  const FLOOR_BOUNCE = 0.15;   // almost no rebound — they land and stay grounded
  const ROLL_FRICTION = 0.985; // horizontal drag while rolling
  let marbles = [], particles = [], bullets = [], shockwaves = [];
  let running = false, t = 0, matchFrames = 0, curBaseR = 30, spawnSeq = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  // Sudden-death: after ~22s, hit damage ramps up so a match can never stall out.
  function rage() { return 1 + Math.max(0, (matchFrames - 1320) / 700); }
  const STORM_START = 1500;   // ~25s: an arena storm starts draining everyone

  // Per-type combat tuning
  const TYPE = {
    robot:  { hp: 260, massMul: 1.8,  rMul: 1.12, damageMul: 1.12, name: "ROBOT" },
    gunner: { hp: 210, massMul: 1.0,  rMul: 0.95, damageMul: 0.95, name: "GUNNER" },
    shark:  { hp: 220, massMul: 1.1,  rMul: 1.0,  damageMul: 1.3,  name: "SHARK" },
    stick:  { hp: 220, massMul: 0.95, rMul: 0.95, damageMul: 1.05, name: "STICK" },
    tank:   { hp: 220, massMul: 2.1,  rMul: 1.18, damageMul: 0.95, name: "TANK" },
    octopus:{ hp: 270, massMul: 0.95, rMul: 1.05, damageMul: 1.3,  name: "OCTOPUS" },
  };

  class Marble {
    constructor(cfg, x, y, r) {
      this.name = cfg.name; this.color = cfg.color; this.type = cfg.type;
      this.team = cfg.team || cfg.name;   // allies share a team; clones inherit it
      this.clone = !!cfg.clone;
      this.baseR = r;                      // radius before type scaling (for cloning)
      const spec = TYPE[cfg.type];
      this.x = x; this.y = y; this.r = r * spec.rMul;
      const a = rand(0, Math.PI * 2), sp = rand(1.4, 2.4);
      this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
      this.maxHp = spec.hp; this.hp = spec.hp;
      this.mass = this.r * this.r * spec.massMul;
      this.damageMul = spec.damageMul;
      this.alive = true; this.roll = 0; this.flash = 0; this.spawnT = 0;
      this.cool = rand(0, 90);   // gunner fire / shark lunge cooldown
      this.lunge = 0;            // shark lunge timer
      this.lash = 0;             // octopus tentacle-lash animation timer
      this.charge = rand(40, 120); // grounded charge/hop cooldown
      this.summonCool = rand(240, 480); // frames until this fighter summons a clone
      this.onGround = false;
      this.facing = 1;
    }
    get speed() { return Math.hypot(this.vx, this.vy); }

    update() {
      if (!this.alive) return;
      this.spawnT = Math.min(1, this.spawnT + 0.05);

      // Arena storm: after a long match, everyone slowly burns down so it always ends.
      if (matchFrames > STORM_START) {
        this.hp -= 0.5 * (1 + (matchFrames - STORM_START) / 240);
        this.flash = Math.max(this.flash, 0.25);
        if (this.hp <= 0) {
          this.hp = 0; this.alive = false;
          spawnBurst(this.x, this.y, this.color, 50, 3.5);
        }
      }

      // Shark AI: periodically lunge at nearest living enemy
      if (this.type === "shark") {
        this.lunge = Math.max(0, this.lunge - 1);
        this.cool--;
        if (this.cool <= 0) {
          const target = nearestEnemy(this);
          if (target) {
            const dx = target.x - this.x, dy = target.y - this.y;
            const d = Math.hypot(dx, dy) || 1;
            this.vx += (dx / d) * 3.0; this.vy += (dy / d) * 3.0;
            this.lunge = 22; SFX.bite();
          }
          this.cool = rand(80, 140);
        }
      }

      // Gunner AI: fire neon rounds at nearest enemy
      if (this.type === "gunner") {
        this.cool--;
        if (this.cool <= 0 && running) {
          const target = nearestEnemy(this);
          if (target) {
            const dx = target.x - this.x, dy = target.y - this.y;
            const d = Math.hypot(dx, dy) || 1;
            const spread = rand(-0.12, 0.12);
            const bx = dx / d, by = dy / d;
            const cs = Math.cos(spread), sn = Math.sin(spread);
            const dirx = bx * cs - by * sn, diry = bx * sn + by * cs;
            bullets.push({
              x: this.x + dirx * this.r, y: this.y + diry * this.r,
              vx: dirx * 6, vy: diry * 6,
              life: 130, color: this.color, owner: this, r: 4,
              dmg: 7 * this.damageMul, knock: 0.06,
            });
            this.vx -= dirx * 0.5; this.vy -= diry * 0.5; // recoil
            SFX.shoot();
          }
          this.cool = rand(26, 44);
        }
      }

      // Tank AI: lob heavy cannon shells at nearest enemy
      if (this.type === "tank") {
        this.cool--;
        if (this.cool <= 0 && running) {
          const target = nearestEnemy(this);
          if (target) {
            const dx = target.x - this.x, dy = target.y - this.y;
            const d = Math.hypot(dx, dy) || 1;
            const dirx = dx / d, diry = dy / d;
            bullets.push({
              x: this.x + dirx * this.r, y: this.y + diry * this.r,
              vx: dirx * 5, vy: diry * 5,
              life: 160, color: this.color, owner: this, r: 7,
              dmg: 11 * this.damageMul, knock: 0.14,
            });
            this.vx -= dirx * 1.3; this.vy -= diry * 1.3; // heavy recoil
            spawnBurst(this.x + dirx * this.r, this.y + diry * this.r, this.color, 12, 2.5);
            SFX.cannon();
          }
          this.cool = rand(104, 150);
        }
      }

      // Octopus AI: whip tentacles, hitting every enemy within reach
      if (this.type === "octopus") {
        this.lash = Math.max(0, this.lash - 1);
        this.cool--;
        if (this.cool <= 0 && running) {
          const reach = this.r * 3.0;
          let hitAny = false;
          for (const m of marbles) {
            if (!m.alive || m.team === this.team) continue;
            const d = Math.hypot(m.x - this.x, m.y - this.y);
            if (d < reach + m.r) {
              m.damage(17 * this.damageMul * rage(), m.x, m.y);
              const nx = (m.x - this.x) / (d || 1), ny = (m.y - this.y) / (d || 1);
              m.vx += nx * 5.5; m.vy += ny * 5.5; // shove away
              hitAny = true;
            }
          }
          this.lash = 12;
          shockwaves.push({ x: this.x, y: this.y, r: this.r, max: reach * 2, color: this.color, life: 0.8 });
          if (hitAny) SFX.lash();
          this.cool = rand(46, 78);
        }
      }

      // Summon: periodically call in a clone ally of the same fighter.
      this.summonCool--;
      if (this.summonCool <= 0 && running) {
        trySummon(this);
        this.summonCool = rand(420, 660); // ~7-11s between summons
      }

      // Grounded charge: hop toward the nearest enemy so they actively brawl
      // instead of settling into a pile. (Sharks/gunners already have their own
      // attacks, so they charge less often.)
      this.charge--;
      if (this.charge <= 0 && running && this.onGround) {
        const target = nearestEnemy(this);
        if (target) {
          const dir = target.x > this.x ? 1 : -1;
          const power = this.type === "robot" ? 4.5 : 5.2;
          this.vx += dir * power;      // dash across the ground toward the enemy
          this.vy -= rand(1.6, 3);     // just a small skip, not a bounce
          spawnBurst(this.x, this.y + this.r * 0.7, this.color, 6, 1.2);
        }
        const base = (this.type === "shark" || this.type === "gunner") ? 120 : 64;
        this.charge = rand(base, base + 60);
      }

      // Gravity
      this.vy += GRAVITY;

      this.x += this.vx; this.y += this.vy;
      if (Math.abs(this.vx) > 0.2) this.facing = this.vx > 0 ? 1 : -1;
      this.roll += this.vx * 0.05;
      this.flash = Math.max(0, this.flash - 0.08);

      // Walls (soft — no bouncy rebound)
      const wallE = 0.3;
      if (this.x - this.r < 0) { this.x = this.r; this.vx = Math.abs(this.vx) * wallE; }
      if (this.x + this.r > W) { this.x = W - this.r; this.vx = -Math.abs(this.vx) * wallE; }
      if (this.y - this.r < 0) { this.y = this.r; this.vy = Math.abs(this.vy) * 0.3; }

      // Floor — they land and stay grounded instead of bouncing around
      this.onGround = false;
      if (this.y + this.r > H) {
        this.y = H - this.r;
        if (this.vy > 2) spawnBurst(this.x, H, this.color, Math.min(10, this.vy | 0), 1.2);
        this.vy = -Math.abs(this.vy) * FLOOR_BOUNCE;
        this.vx *= ROLL_FRICTION;          // rolling drag
        if (Math.abs(this.vy) < 2.4) { this.vy = 0; this.onGround = true; } // settle quickly
      }

      const sp = this.speed, MAXV = 10;
      if (sp > MAXV) { this.vx *= MAXV / sp; this.vy *= MAXV / sp; }

      if (Math.random() < 0.5) {
        particles.push({
          x: this.x - this.vx * 2, y: this.y - this.vy * 2,
          vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3),
          life: 1, decay: rand(0.03, 0.06),
          r: this.r * rand(0.12, 0.28), color: this.color,
        });
      }
    }

    damage(amount, fx, fy) {
      if (!this.alive) return;
      this.hp -= amount; this.flash = 1;
      spawnBurst(fx, fy, this.color, Math.min(24, 6 + amount));
      if (this.hp <= 0) {
        this.hp = 0; this.alive = false;
        spawnBurst(this.x, this.y, this.color, 64, 4);
        shockwaves.push({ x: this.x, y: this.y, r: this.r, max: 280, color: this.color, life: 1 });
        SFX.death();
      }
    }

    draw() {
      if (!this.alive) return;
      const scale = 0.4 + 0.6 * this.spawnT;
      const r = this.r * scale;
      ctx.save();
      ctx.translate(this.x, this.y);

      // Soft neon glow behind the character (no marble shell)
      const glow = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 1.5);
      glow.addColorStop(0, hexA(this.color, 0.35 + this.flash * 0.3));
      glow.addColorStop(1, hexA(this.color, 0));
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2); ctx.fill();

      // The character itself, drawn large and upright — the fighter IS the marble now
      ctx.save();
      ctx.scale(this.facing, 1);
      const draw = FIGURE[this.type];
      draw(ctx, r * 1.5, this.roll, this.color, this.flash, this.lunge > 0 || this.lash > 0);
      ctx.restore();

      ctx.restore();
    }
  }

  function nearestEnemy(self) {
    let best = null, bd = Infinity;
    for (const m of marbles) {
      if (m === self || !m.alive || m.team === self.team) continue;
      const d = Math.hypot(m.x - self.x, m.y - self.y);
      if (d < bd) { bd = d; best = m; }
    }
    return best;
  }

  function teamCount(team) {
    let c = 0;
    for (const m of marbles) if (m.alive && m.team === team) c++;
    return c;
  }

  const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function aliveTeamCount() {
    const s = new Set();
    for (const m of marbles) if (m.alive) s.add(m.team);
    return s.size;
  }

  // Summon a clone ally next to the summoner (bounded by team + global caps).
  function trySummon(src) {
    if (marbles.length >= MAX_MARBLES) return;
    if (teamCount(src.team) >= TEAM_CAP) return;
    if ((teamSummons[src.team] || 0) >= SUMMON_BUDGET) return; // finite reinforcements
    if (aliveTeamCount() <= 2) return; // endgame duel is fought without replenishment
    teamSummons[src.team] = (teamSummons[src.team] || 0) + 1;
    const cfg = { name: src.name, type: src.type, color: src.color, team: src.team, clone: true };
    const ang = rand(-Math.PI, 0); // spawn to the side / above
    const r = src.baseR * 0.85;    // clones a touch smaller
    const x = clampN(src.x + Math.cos(ang) * src.r * 2.4, r, W - r);
    const y = clampN(src.y - Math.abs(Math.sin(ang)) * src.r * 2.4, r, H - r);
    const clone = new Marble(cfg, x, y, r);
    clone.hp = clone.maxHp = clone.maxHp * 0.65; // clones are weaker
    clone.vy = -5; clone.spawnT = 0;             // pop into existence
    marbles.push(clone);
    // summon FX
    spawnBurst(x, y, src.color, 28, 3);
    shockwaves.push({ x, y, r: 6, max: src.r * 4, color: src.color, life: 1 });
    SFX.summon();
  }

  // ---- Figure renderers (each fighter drawn directly, no marble shell) ----
  function neonStroke(ctx, color, w) {
    ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#f2ffff"; ctx.shadowColor = color; ctx.shadowBlur = 10;
  }

  const FIGURE = {
    // Upright stick figure that runs in place (arms/legs swing as it moves)
    stick(ctx, r, roll, color, flash) {
      ctx.save(); ctx.rotate(Math.sin(roll * 3) * 0.1); // slight running lean, no tumbling
      const u = r * 0.16; neonStroke(ctx, color, Math.max(2, r * 0.05));
      if (flash > 0.4) ctx.strokeStyle = "#fff";
      const headR = u * 0.85, headY = -u * 2.4, swing = Math.sin(roll * 3) * 0.6;
      ctx.beginPath(); ctx.moveTo(0, headY + headR); ctx.lineTo(0, u * 0.6); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, headY + headR * 1.6); ctx.lineTo(Math.cos(swing) * u * 1.1, headY + headR * 1.6 + Math.sin(swing) * u);
      ctx.moveTo(0, headY + headR * 1.6); ctx.lineTo(-Math.cos(swing) * u * 1.1, headY + headR * 1.6 - Math.sin(swing) * u);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, u * 0.6); ctx.lineTo(Math.sin(swing) * u * 0.9, u * 0.6 + u * 1.3);
      ctx.moveTo(0, u * 0.6); ctx.lineTo(-Math.sin(swing) * u * 0.9, u * 0.6 + u * 1.3);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    },

    // Boxy robot with antenna + glowing eye
    robot(ctx, r, roll, color, flash) {
      ctx.save();
      const u = r * 0.18; neonStroke(ctx, color, Math.max(2, r * 0.055));
      if (flash > 0.4) ctx.strokeStyle = "#fff";
      const bob = Math.sin(roll * 4) * u * 0.12;
      ctx.translate(0, bob);
      // legs
      ctx.beginPath();
      ctx.moveTo(-u * 0.5, u * 1.4); ctx.lineTo(-u * 0.5, u * 2.1);
      ctx.moveTo(u * 0.5, u * 1.4);  ctx.lineTo(u * 0.5, u * 2.1);
      ctx.stroke();
      // body
      ctx.strokeRect(-u, -u * 0.2, u * 2, u * 1.6);
      // arms
      ctx.beginPath();
      ctx.moveTo(-u, u * 0.4); ctx.lineTo(-u * 1.7, u * 0.9);
      ctx.moveTo(u, u * 0.4);  ctx.lineTo(u * 1.7, u * 0.9);
      ctx.stroke();
      // head
      ctx.strokeRect(-u * 0.7, -u * 1.7, u * 1.4, u * 1.3);
      // antenna
      ctx.beginPath(); ctx.moveTo(0, -u * 1.7); ctx.lineTo(0, -u * 2.3); ctx.stroke();
      // eye (filled glow)
      ctx.shadowBlur = 14; ctx.fillStyle = flash > 0.4 ? "#fff" : color;
      ctx.beginPath(); ctx.arc(0, -u * 1.05, u * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -u * 2.4, u * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    },

    // Person aiming a machine gun (muzzle flashes when firing)
    gunner(ctx, r, roll, color, flash) {
      ctx.save();
      const u = r * 0.16; neonStroke(ctx, color, Math.max(2, r * 0.05));
      if (flash > 0.4) ctx.strokeStyle = "#fff";
      const headR = u * 0.8, headY = -u * 2.2;
      // body
      ctx.beginPath(); ctx.moveTo(0, headY + headR); ctx.lineTo(0, u * 0.7); ctx.stroke();
      // legs braced
      ctx.beginPath();
      ctx.moveTo(0, u * 0.7); ctx.lineTo(-u * 1.0, u * 2.0);
      ctx.moveTo(0, u * 0.7); ctx.lineTo(u * 0.9, u * 1.9);
      ctx.stroke();
      // head
      ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.stroke();
      // arms holding gun forward (facing +x, flipped by facing)
      const gy = headY + headR * 1.7;
      ctx.beginPath();
      ctx.moveTo(0, gy); ctx.lineTo(u * 1.4, gy - u * 0.1);
      ctx.moveTo(0, gy + u * 0.2); ctx.lineTo(u * 1.2, gy - u * 0.1);
      ctx.stroke();
      // gun barrel
      ctx.lineWidth = Math.max(2, r * 0.07);
      ctx.beginPath(); ctx.moveTo(u * 1.4, gy - u * 0.1); ctx.lineTo(u * 2.5, gy - u * 0.1); ctx.stroke();
      // magazine
      ctx.lineWidth = Math.max(2, r * 0.045);
      ctx.beginPath(); ctx.moveTo(u * 1.9, gy - u * 0.1); ctx.lineTo(u * 1.9, gy + u * 0.6); ctx.stroke();
      // muzzle flash when just fired
      if (this && false) {}
      ctx.restore();
    },

    // Shark: torpedo body, fin, tail, jagged teeth (opens jaw on lunge)
    shark(ctx, r, roll, color, flash, lunging) {
      ctx.save();
      const u = r * 0.2; neonStroke(ctx, color, Math.max(2, r * 0.05));
      if (flash > 0.4) ctx.strokeStyle = "#fff";
      const sway = Math.sin(roll * 5) * u * 0.25;
      // body (torpedo, nose to +x)
      ctx.beginPath();
      ctx.moveTo(-u * 2.0, sway);                       // tail base
      ctx.quadraticCurveTo(-u * 0.5, -u * 1.1, u * 2.3, 0);  // top to snout
      ctx.quadraticCurveTo(-u * 0.5, u * 1.1, -u * 2.0, sway); // bottom back to tail
      ctx.stroke();
      // tail fin
      ctx.beginPath();
      ctx.moveTo(-u * 2.0, sway);
      ctx.lineTo(-u * 2.9, sway - u * 0.9);
      ctx.moveTo(-u * 2.0, sway);
      ctx.lineTo(-u * 2.9, sway + u * 0.9);
      ctx.stroke();
      // dorsal fin
      ctx.beginPath();
      ctx.moveTo(-u * 0.2, -u * 0.95); ctx.lineTo(u * 0.4, -u * 1.9); ctx.lineTo(u * 0.9, -u * 0.75);
      ctx.stroke();
      // eye
      ctx.shadowBlur = 12; ctx.fillStyle = flash > 0.4 ? "#fff" : color;
      ctx.beginPath(); ctx.arc(u * 1.3, -u * 0.25, u * 0.14, 0, Math.PI * 2); ctx.fill();
      // mouth + teeth
      const jaw = lunging ? u * 0.55 : u * 0.18;
      ctx.lineWidth = Math.max(1.5, r * 0.03);
      ctx.beginPath(); ctx.moveTo(u * 2.3, 0); ctx.lineTo(u * 1.1, jaw + u * 0.3); ctx.stroke();
      ctx.beginPath();
      let sx = u * 2.15;
      for (let i = 0; i < 4; i++) {
        ctx.moveTo(sx, jaw * 0.2);
        ctx.lineTo(sx - u * 0.18, jaw * 0.2 + u * 0.28);
        sx -= u * 0.28;
      }
      ctx.stroke();
      ctx.restore();
    },

    // Tank: hull on treads with a turret and a forward cannon barrel
    tank(ctx, r, roll, color, flash) {
      ctx.save();
      const u = r * 0.17; neonStroke(ctx, color, Math.max(2, r * 0.05));
      if (flash > 0.4) ctx.strokeStyle = "#fff";
      const bob = Math.sin(roll * 6) * u * 0.05;
      ctx.translate(0, bob);
      // hull
      ctx.strokeRect(-u * 1.7, u * 0.1, u * 3.4, u * 1.05);
      // tread rail + road wheels
      ctx.beginPath(); ctx.moveTo(-u * 1.9, u * 1.55); ctx.lineTo(u * 1.9, u * 1.55); ctx.stroke();
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.arc(i * u * 0.82, u * 1.55, u * 0.26, 0, Math.PI * 2); ctx.stroke();
      }
      // turret
      ctx.strokeRect(-u * 0.9, -u * 0.95, u * 1.7, u * 1.05);
      // cannon barrel (points forward, flipped by facing)
      ctx.lineWidth = Math.max(2, r * 0.075);
      ctx.beginPath(); ctx.moveTo(u * 0.8, -u * 0.42); ctx.lineTo(u * 2.7, -u * 0.42); ctx.stroke();
      ctx.restore();
    },

    // Octopus: domed head with two eyes and eight wiggling tentacles
    // (tentacles splay outward when it lashes)
    octopus(ctx, r, roll, color, flash, lashing) {
      ctx.save();
      const u = r * 0.2; neonStroke(ctx, color, Math.max(2, r * 0.045));
      if (flash > 0.4) ctx.strokeStyle = "#fff";
      // mantle / head dome
      ctx.beginPath(); ctx.arc(0, -u * 0.3, u * 1.15, Math.PI, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-u * 1.15, -u * 0.3); ctx.lineTo(-u * 0.95, u * 0.6);
      ctx.moveTo(u * 1.15, -u * 0.3);  ctx.lineTo(u * 0.95, u * 0.6);
      ctx.stroke();
      // eyes
      ctx.shadowBlur = 10; ctx.fillStyle = flash > 0.4 ? "#fff" : color;
      ctx.beginPath(); ctx.arc(-u * 0.45, -u * 0.35, u * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(u * 0.45, -u * 0.35, u * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 6;
      // eight tentacles from the base
      const spread = lashing ? 1.8 : 1.0;
      for (let i = 0; i < 8; i++) {
        const t = -1 + i * (2 / 7);
        const baseX = t * u * 0.9;
        const wig = Math.sin(roll * 4 + i * 0.8) * u * 0.45;
        ctx.beginPath();
        ctx.moveTo(baseX, u * 0.6);
        ctx.quadraticCurveTo(baseX * 1.5 * spread + wig, u * 1.5,
                             baseX * 2.0 * spread + wig * 0.5, u * 2.15);
        ctx.stroke();
      }
      ctx.restore();
    },
  };

  // ---- Particles & bullets ------------------------------------------------
  function spawnBurst(x, y, color, n, speedMul = 2) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(0.5, 3) * speedMul;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: rand(0.015, 0.045), r: rand(1.5, 4), color,
      });
    }
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      let hit = false;
      for (const m of marbles) {
        if (!m.alive || m === b.owner || m.team === b.owner.team) continue;
        if (Math.hypot(m.x - b.x, m.y - b.y) < m.r) {
          m.damage((b.dmg || 7) * rage(), b.x, b.y);
          const k = b.knock || 0.06;
          m.vx += b.vx * k; m.vy += b.vy * k;
          hit = true; break;
        }
      }
      if (hit || b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
        spawnBurst(b.x, b.y, b.color, 4, 1.5);
        bullets.splice(i, 1);
      } else {
        particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.6, decay: 0.12, r: 2, color: b.color });
      }
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.r += (sw.max - sw.r) * 0.08; sw.life -= 0.03;
      if (sw.life <= 0) shockwaves.splice(i, 1);
    }
  }

  function drawParticles() {
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    for (const b of bullets) {
      ctx.globalAlpha = 1; ctx.fillStyle = b.color;
      ctx.shadowColor = b.color; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    for (const sw of shockwaves) {
      ctx.globalAlpha = Math.max(0, sw.life) * 0.7; ctx.lineWidth = 3; ctx.strokeStyle = sw.color;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }

  // ---- Marble collisions --------------------------------------------------
  function collide() {
    for (let i = 0; i < marbles.length; i++) {
      const a = marbles[i]; if (!a.alive) continue;
      for (let j = i + 1; j < marbles.length; j++) {
        const b = marbles[j]; if (!b.alive) continue;
        let dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
        const min = a.r + b.r;
        if (dist < min && dist > 0) {
          const nx = dx / dist, ny = dy / dist, overlap = min - dist;
          const totalMass = a.mass + b.mass;
          a.x -= nx * overlap * (b.mass / totalMass); a.y -= ny * overlap * (b.mass / totalMass);
          b.x += nx * overlap * (a.mass / totalMass); b.y += ny * overlap * (a.mass / totalMass);
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy, velN = rvx * nx + rvy * ny;
          if (velN < 0) {
            const rest = 0.98, imp = -(1 + rest) * velN / totalMass, ix = imp * nx, iy = imp * ny;
            a.vx -= ix * b.mass; a.vy -= iy * b.mass;
            b.vx += ix * a.mass; b.vy += iy * a.mass;
            const impact = Math.abs(velN);
            if (impact > 1.2 && a.team !== b.team) {   // allies bump but never hurt each other
              const cx = a.x + nx * a.r, cy = a.y + ny * a.r;
              // shark lunge bite bonus
              const aBonus = (a.type === "shark" && a.lunge > 0) ? 1.9 : 1;
              const bBonus = (b.type === "shark" && b.lunge > 0) ? 1.9 : 1;
              const rg = rage();
              a.damage(Math.min(20, impact * 1.6) * b.damageMul * bBonus * rg, cx, cy);
              b.damage(Math.min(20, impact * 1.6) * a.damageMul * aBonus * rg, cx, cy);
              shockwaves.push({ x: cx, y: cy, r: min * 0.4, max: min * 1.6, color: "#ffffff", life: 0.8 });
              SFX.hit();
            }
          }
        }
      }
    }
  }

  // ---- HUD ----------------------------------------------------------------
  let cards = [];
  function addCard(m) {
    const card = document.createElement("div");
    card.className = "fighter-card";
    card.innerHTML =
      `<div class="name" style="color:${m.color}">${m.name}
         <span class="count"></span>
         <span class="tag">${TYPE[m.type].name}</span></div>
       <div class="hpbar"><div class="hpfill" style="background:${m.color}"></div></div>`;
    hud.appendChild(card);
    cards.push({ card, fill: card.querySelector(".hpfill"),
                 count: card.querySelector(".count"), team: m.team });
  }
  function buildHud() {
    hud.innerHTML = ""; cards = [];
    for (const m of marbles) addCard(m); // at setup, one original per team
  }
  function updateHud() {
    for (const c of cards) {
      // A squad is alive while any member (original or clone) lives.
      let alive = 0, leader = null;
      for (const m of marbles) {
        if (m.team === c.team && m.alive) {
          alive++;
          if (!leader || m.hp > leader.hp) leader = m;
        }
      }
      c.fill.style.width = (leader ? leader.hp / leader.maxHp * 100 : 0) + "%";
      c.count.textContent = alive > 1 ? "×" + alive : "";
      c.card.classList.toggle("dead", alive === 0);
    }
  }

  // Player-triggered: drop a fresh fighter (its own team) in from the top.
  function spawnFighter() {
    if (marbles.length >= 24) return;               // hard cap so it can't get silly
    const pick = ROSTER[(Math.random() * ROSTER.length) | 0];
    const team = pick.name + "#" + (++spawnSeq);     // unique team → fights everyone
    const cfg = { name: pick.name, type: pick.type, color: pick.color, team };
    const r = curBaseR;
    const x = rand(r * 1.6, W - r * 1.6), y = r * 1.4;
    const m = new Marble(cfg, x, y, r);
    m.vx = rand(-2, 2); m.vy = 2; m.spawnT = 0;
    marbles.push(m);
    addCard(m); updateHud();
    spawnBurst(x, y, cfg.color, 26, 3);
    shockwaves.push({ x, y, r: 6, max: r * 4, color: cfg.color, life: 1 });
    SFX.summon();
  }
  function spawnWave() {
    if (!running) return;
    initAudio();
    if (actx && actx.state === "suspended") actx.resume();
    spawnFighter(); spawnFighter();  // a couple at a time
  }
  spawnBtn.addEventListener("click", spawnWave);

  // ---- Winner celebration confetti (DOM, layered over the overlay) --------
  function clearConfetti() {
    overlay.querySelectorAll(".confetti").forEach(el => el.remove());
  }
  function spawnConfetti(color) {
    clearConfetti();
    const palette = [color, "#ffffff", "#ffd23f", color];
    for (let i = 0; i < 150; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = rand(0, 100) + "vw";
      c.style.background = palette[(Math.random() * palette.length) | 0];
      const w = rand(6, 12);
      c.style.width = w + "px";
      c.style.height = rand(9, 18) + "px";
      c.style.animationDuration = rand(2.6, 5).toFixed(2) + "s";
      c.style.animationDelay = rand(0, 1.6).toFixed(2) + "s";
      c.style.opacity = rand(0.75, 1).toFixed(2);
      overlay.appendChild(c);
    }
  }

  function hexA(hex, a) {
    const h = hex.replace("#", "");
    const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // ---- Game flow ----------------------------------------------------------
  function setup() {
    marbles = []; particles = []; bullets = []; shockwaves = [];
    const roster = [...ROSTER].sort(() => Math.random() - 0.5).slice(0, NUM_FIGHTERS);
    // bigger characters when the field is small so you can see them move
    const sizeK = roster.length > 8 ? 0.045 : roster.length > 5 ? 0.072 : 0.09;
    const baseR = Math.max(26, Math.min(W, H) * sizeK);
    curBaseR = baseR;
    for (const cfg of roster) {
      let x, y, ok, tries = 0;
      do {
        x = rand(baseR * 1.6, W - baseR * 1.6);
        y = rand(baseR * 1.6 + 60, H - baseR * 1.6);
        ok = true;
        for (const m of marbles) if (Math.hypot(m.x - x, m.y - y) < baseR * 2.4) { ok = false; break; }
        tries++;
      } while (!ok && tries < 400);
      marbles.push(new Marble(cfg, x, y, baseR));
    }
    buildHud(); updateHud();
  }

  function checkWin() {
    const alive = marbles.filter(m => m.alive);
    const teams = new Set(alive.map(m => m.team));
    if (teams.size <= 1 && running) {
      running = false;
      spawnBtn.classList.add("off");
      const champ = alive[0];
      const squad = champ ? alive.filter(m => m.team === champ.team).length : 0;
      if (champ) { SFX.win(); spawnConfetti(champ.color); }
      setTimeout(() => {
        if (champ) {
          winnerEl.textContent = champ.name + " WINS!";
          winnerEl.style.color = champ.color;
          winnerEl.style.textShadow = `0 0 24px ${champ.color}`;
          winnerEl.classList.add("celebrate");
          titleEl.textContent = "CHAMPION";
          subtitleEl.textContent = TYPE[champ.type].name +
            (squad > 1 ? ` squad of ${squad} takes the arena` : " takes the arena");
        } else {
          winnerEl.textContent = "DRAW!";
          winnerEl.style.color = "#fff"; titleEl.textContent = "NEON MARBLE BATTLE";
          subtitleEl.textContent = "Nobody left standing";
        }
        startBtn.textContent = "FIGHT AGAIN";
        overlay.classList.remove("hidden");
      }, 900);
    }
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = "rgba(80,140,255,0.06)"; ctx.lineWidth = 1;
    const step = 48;
    for (let x = 0; x <= W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = "rgba(57,255,20,0.12)"; ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);

    // Glowing neon floor
    const fy = H - 2;
    const fl = ctx.createLinearGradient(0, fy - 60, 0, fy);
    fl.addColorStop(0, "rgba(57,255,20,0)");
    fl.addColorStop(1, "rgba(57,255,20,0.10)");
    ctx.fillStyle = fl;
    ctx.fillRect(0, fy - 60, W, 60);
    ctx.strokeStyle = "rgba(57,255,20,0.85)";
    ctx.lineWidth = 3; ctx.shadowColor = "#39ff14"; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
    ctx.shadowBlur = 0;

    // Storm warning vignette once sudden-death drain kicks in
    if (running && matchFrames > STORM_START) {
      const puls = 0.12 + 0.06 * Math.sin(matchFrames * 0.15);
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
      vg.addColorStop(0, "rgba(255,40,40,0)");
      vg.addColorStop(1, `rgba(255,40,40,${puls})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function loop() {
    t++; soundsThisFrame = 0;
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    updateParticles();
    if (running) { matchFrames++; for (const m of marbles) m.update(); collide(); updateBullets(); }
    drawParticles();
    for (const m of marbles) m.draw();
    updateHud();
    if (running) checkWin();
    requestAnimationFrame(loop);
  }

  function start() {
    initAudio();
    if (actx && actx.state === "suspended") actx.resume();
    clearConfetti();
    winnerEl.classList.remove("celebrate");
    setup(); matchFrames = 0; teamSummons = {};
    overlay.classList.add("hidden"); running = true;
    spawnBtn.classList.remove("off");
  }
  startBtn.addEventListener("click", start);

  function pushFrom(px, py) {
    if (!running) return;
    shockwaves.push({ x: px, y: py, r: 8, max: 220, color: "#ffffff", life: 1 });
    spawnBurst(px, py, "#ffffff", 18, 3);
    SFX.shock();
    for (const m of marbles) {
      if (!m.alive) continue;
      const dx = m.x - px, dy = m.y - py, d = Math.hypot(dx, dy) || 1;
      const force = Math.max(0, 1 - d / 320) * 9;
      m.vx += (dx / d) * force; m.vy += (dy / d) * force;
    }
  }
  canvas.addEventListener("pointerdown", (e) => {
    const rect = canvas.getBoundingClientRect();
    pushFrom(e.clientX - rect.left, e.clientY - rect.top);
  });

  loop();
})();
</script>
</body>
</html>
